<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Resolving relative paths from a working directory</title>
  <desc id="description">A project tree marks main as the current working directory, src as its parent, test as its sibling, and transit-board as the project root. A table maps dot, dot-dot, dot-dot slash test, and two dot-dot components to those destinations.</desc>
  <defs>
    <style>
      text { fill: #17211b; font-family: "IBM Plex Sans", Arial, sans-serif; }
      .panel { fill: #fffdf7; stroke: #cbd7ce; stroke-width: 1.5; }
      .heading { font-size: 20px; font-weight: 700; }
      .tree-line { fill: none; stroke: #839087; stroke-width: 2.5; }
      .directory { fill: #edf4ee; stroke: #064638; stroke-width: 2; }
      .current { fill: #f5e8cb; stroke: #7b5514; stroke-width: 3; }
      .file { fill: #fffdf7; stroke: #9aaba0; stroke-width: 1.5; }
      .node-name { font-family: "JetBrains Mono", Menlo, monospace; font-size: 16px; font-weight: 700; }
      .node-kind { fill: #526057; font-size: 13px; }
      .badge { fill: #17211b; }
      .badge-current { fill: #7b5514; }
      .badge-text { fill: #fffdf7; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .start { fill: #526057; font-size: 14px; font-weight: 700; letter-spacing: 0.6px; }
      .start-path { font-family: "JetBrains Mono", Menlo, monospace; font-size: 17px; font-weight: 700; }
      .path { fill: #064638; font-family: "JetBrains Mono", Menlo, monospace; font-size: 19px; font-weight: 700; }
      .arrow { fill: #526057; font-size: 21px; font-weight: 700; }
      .destination { font-size: 16px; font-weight: 700; }
      .explanation { fill: #526057; font-size: 14px; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="500" height="500" rx="12"/>
  <text class="heading" x="45" y="56">The project directory tree</text>

  <path class="tree-line" d="M85 140 V308 M85 175 H118 M85 238 H118 M85 308 H154"/>
  <path class="tree-line" d="M185 339 V454 M185 381 H220 M185 454 H220"/>

  <rect class="directory" x="45" y="78" width="260" height="62" rx="8"/>
  <circle class="badge" cx="74" cy="109" r="16"/>
  <text class="badge-text" x="74" y="114">1</text>
  <text class="node-name" x="102" y="104">transit-board/</text>
  <text class="node-kind" x="102" y="126">project root</text>

  <rect class="file" x="118" y="151" width="250" height="48" rx="7"/>
  <text class="node-name" x="140" y="181">build.gradle.kts</text>
  <rect class="file" x="118" y="214" width="250" height="48" rx="7"/>
  <text class="node-name" x="140" y="244">gradlew</text>

  <rect class="directory" x="154" y="277" width="230" height="62" rx="8"/>
  <circle class="badge" cx="183" cy="308" r="16"/>
  <text class="badge-text" x="183" y="313">2</text>
  <text class="node-name" x="211" y="303">src/</text>
  <text class="node-kind" x="211" y="325">parent of main and test</text>

  <rect class="current" x="220" y="350" width="260" height="62" rx="8"/>
  <circle class="badge-current" cx="249" cy="381" r="16"/>
  <text class="badge-text" x="249" y="386">3</text>
  <text class="node-name" x="277" y="376">main/</text>
  <text class="node-kind" x="277" y="398">current working directory</text>

  <rect class="directory" x="220" y="423" width="230" height="62" rx="8"/>
  <circle class="badge" cx="249" cy="454" r="16"/>
  <text class="badge-text" x="249" y="459">4</text>
  <text class="node-name" x="277" y="449">test/</text>
  <text class="node-kind" x="277" y="471">sibling of main</text>

  <rect class="panel" x="540" y="20" width="400" height="500" rx="12"/>
  <text class="heading" x="565" y="56">Paths from the working directory</text>
  <text class="start" x="565" y="88">STARTING AT</text>
  <text class="start-path" x="565" y="116">transit-board/src/main</text>

  <line x1="565" y1="139" x2="915" y2="139" stroke="#cbd7ce" stroke-width="1.5"/>

  <text class="path" x="570" y="185">.</text>
  <text class="arrow" x="705" y="185">→</text>
  <circle class="badge-current" cx="752" cy="179" r="16"/>
  <text class="badge-text" x="752" y="184">3</text>
  <text class="destination" x="780" y="176">main</text>
  <text class="explanation" x="780" y="197">stay here</text>

  <text class="path" x="570" y="269">..</text>
  <text class="arrow" x="705" y="269">→</text>
  <circle class="badge" cx="752" cy="263" r="16"/>
  <text class="badge-text" x="752" y="268">2</text>
  <text class="destination" x="780" y="260">src</text>
  <text class="explanation" x="780" y="281">one parent up</text>

  <text class="path" x="570" y="353">../test</text>
  <text class="arrow" x="705" y="353">→</text>
  <circle class="badge" cx="752" cy="347" r="16"/>
  <text class="badge-text" x="752" y="352">4</text>
  <text class="destination" x="780" y="344">test</text>
  <text class="explanation" x="780" y="365">parent, then child</text>

  <text class="path" x="570" y="437">../..</text>
  <text class="arrow" x="705" y="437">→</text>
  <circle class="badge" cx="752" cy="431" r="16"/>
  <text class="badge-text" x="752" y="436">1</text>
  <text class="destination" x="780" y="428">transit-board</text>
  <text class="explanation" x="780" y="449">two parents up</text>

  <rect x="565" y="476" width="350" height="27" rx="13" fill="#edf4ee"/>
  <text class="explanation" x="740" y="495" text-anchor="middle">Resolve every relative path from the working directory.</text>
</svg>
