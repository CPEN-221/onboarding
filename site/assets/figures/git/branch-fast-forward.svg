<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">A fast-forward merge moves a branch name without creating a commit</title>
  <desc id="description">Before the merge, main points to commit B and the improve-message branch points to commit D. After a fast-forward merge, both branch names point to D and the four commits are unchanged.</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0 0 L8 4 L0 8 Z" fill="#064638"/>
    </marker>
    <style>
      text { fill: #17211b; font-family: "IBM Plex Sans", Arial, sans-serif; }
      .panel { fill: #fffdf7; stroke: #cbd7ce; stroke-width: 1.5; }
      .panel-title { font-size: 19px; font-weight: 700; }
      .history { fill: none; stroke: #526057; stroke-width: 4; }
      .commit { fill: #fffdf7; stroke: #17211b; stroke-width: 3; }
      .feature-commit { fill: #edf4ee; stroke: #064638; stroke-width: 3; }
      .commit-id { font-family: "JetBrains Mono", Menlo, monospace; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .commit-copy { fill: #526057; font-size: 14px; text-anchor: middle; }
      .pointer-main { fill: #17211b; }
      .pointer-feature { fill: #12634f; }
      .pointer-label { fill: #fffdf7; font-family: "JetBrains Mono", Menlo, monospace; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .pointer-line { fill: none; marker-end: url(#arrow); stroke: #064638; stroke-width: 2.5; }
      .merge-label { fill: #064638; font-family: "JetBrains Mono", Menlo, monospace; font-size: 14px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="920" height="190" rx="12"/>
  <text class="panel-title" x="42" y="51">Before the merge</text>
  <path class="history" d="M135 139 H315 H520 H730"/>
  <circle class="commit" cx="135" cy="139" r="23"/>
  <circle class="commit" cx="315" cy="139" r="23"/>
  <circle class="feature-commit" cx="520" cy="139" r="23"/>
  <circle class="feature-commit" cx="730" cy="139" r="23"/>
  <text class="commit-id" x="135" y="145">A</text>
  <text class="commit-id" x="315" y="145">B</text>
  <text class="commit-id" x="520" y="145">C</text>
  <text class="commit-id" x="730" y="145">D</text>
  <text class="commit-copy" x="135" y="181">older</text>
  <text class="commit-copy" x="730" y="181">newer</text>

  <rect class="pointer-main" x="247" y="67" width="136" height="30" rx="15"/>
  <text class="pointer-label" x="315" y="87">HEAD → main</text>
  <path class="pointer-line" d="M315 98 V109"/>
  <rect class="pointer-feature" x="641" y="67" width="178" height="30" rx="15"/>
  <text class="pointer-label" x="730" y="87">improve-message</text>
  <path class="pointer-line" d="M730 98 V109"/>

  <path class="pointer-line" d="M870 211 V257"/>
  <text class="merge-label" x="785" y="232">git merge --ff-only</text>
  <text class="merge-label" x="785" y="251">improve-message</text>

  <rect class="panel" x="20" y="260" width="920" height="190" rx="12"/>
  <text class="panel-title" x="42" y="291">After the fast-forward</text>
  <path class="history" d="M135 379 H315 H520 H730"/>
  <circle class="commit" cx="135" cy="379" r="23"/>
  <circle class="commit" cx="315" cy="379" r="23"/>
  <circle class="feature-commit" cx="520" cy="379" r="23"/>
  <circle class="feature-commit" cx="730" cy="379" r="23"/>
  <text class="commit-id" x="135" y="385">A</text>
  <text class="commit-id" x="315" y="385">B</text>
  <text class="commit-id" x="520" y="385">C</text>
  <text class="commit-id" x="730" y="385">D</text>
  <text class="commit-copy" x="135" y="421">older</text>
  <text class="commit-copy" x="730" y="421">newer</text>

  <rect class="pointer-main" x="548" y="307" width="136" height="30" rx="15"/>
  <text class="pointer-label" x="616" y="327">HEAD → main</text>
  <path class="pointer-line" d="M655 338 L704 356"/>
  <rect class="pointer-feature" x="692" y="307" width="178" height="30" rx="15"/>
  <text class="pointer-label" x="781" y="327">improve-message</text>
  <path class="pointer-line" d="M766 338 L745 354"/>
</svg>
